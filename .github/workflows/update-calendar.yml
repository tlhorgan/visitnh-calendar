name: Update Visit NH calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_calendar.py"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 python-dateutil icalendar
          python -m playwright install --with-deps chromium

      - name: Generate calendar
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          python generate_calendar.py 2>&1 | tee nh-update.log

      - name: Commit updated calendar and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitnh.ics nh-update.log
          git add nh-debug.html nh-app.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update Visit NH calendar"
            git push
          fi
          if [ "${{ steps.generate.outcome }}" != "success" ]; then
            exit 1
          fi
